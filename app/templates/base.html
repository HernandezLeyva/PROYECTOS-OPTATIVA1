<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FriendlyEats{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">🍽️ FriendlyEats</a>
            <nav>
                <a href="/">Restaurantes</a>
                <a class="btn btn-small" href="/restaurants/new">+ Nuevo restaurante</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block flash %}{% endblock %}
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">FriendlyEats · Restaurantes populares de la zona · Sprint 1</div>
    </footer>
</body>
</html>
